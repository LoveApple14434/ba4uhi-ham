name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ba4uhi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy static site
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'server' \
            --exclude 'card' \
            --exclude 'preview-*.jpg' \
            --exclude 'assets/data.js' \
            --exclude 'README.md' \
            ./ deploy:/var/www/ba4uhi/

      - name: Deploy admin server
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'backups' \
            --exclude 'node_modules' \
            server/ deploy:/opt/ba4uhi-admin/

      - name: Fix ownership and restart
        run: |
          ssh deploy 'sudo chown -R www-data:www-data /var/www/ba4uhi-data \
            && sudo chmod -R g+w /var/www/ba4uhi /opt/ba4uhi-admin \
            && sudo chown www-data:www-data /opt/ba4uhi-admin/.env \
            && sudo chmod 600 /opt/ba4uhi-admin/.env \
            && sudo systemctl restart ba4uhi-admin \
            && sleep 2 && systemctl is-active ba4uhi-admin'

      - name: Smoke test
        run: |
          sleep 3
          check() {
            local name="$1" url="$2" want="$3"
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
              if [ "$code" = "$want" ]; then
                echo "$name OK ($code)"
                return 0
              fi
              echo "$name attempt $i -> $code, retrying"
              sleep 5
            done
            echo "$name expected $want, got $code"
            return 1
          }
          fail=0
          check "public page" "https://loveapple.space/ba4uhi/" 200 || fail=1
          check "admin page"  "https://loveapple.space/ba4uhi-admin/" 200 || fail=1
          check "data file"   "https://loveapple.space/ba4uhi/assets/data.js?ci=$(date +%s)" 200 || fail=1
          exit $fail
